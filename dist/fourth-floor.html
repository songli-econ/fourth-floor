<html lang="zh-CN">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>四楼</title>
<meta name="description" content="一栋老公寓的四楼，几个室友，每天一点点的生活。">
<meta name="theme-color" content="#2a2233">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='14' width='44' height='44' rx='4' fill='%23e8b26a'/%3E%3Crect x='18' y='22' width='12' height='12' fill='%23fff3cf'/%3E%3Crect x='34' y='22' width='12' height='12' fill='%23fff3cf'/%3E%3Crect x='26' y='40' width='12' height='18' fill='%237b4b33'/%3E%3Cpath d='M6 16 L32 4 L58 16' stroke='%237b4b33' stroke-width='5' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #3a2e26;
  --ink-soft: #6f5e50;
  --paper: rgba(253, 248, 238, 0.94);
  --paper-solid: #fdf8ee;
  --edge: #e3d3b8;
  --accent: #c8693f;
  --accent-ink: #fff8ee;
  --shadow: 0 10px 40px rgba(40, 25, 10, 0.28);
  --serif: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
  --hand: 'Ma Shan Zheng', 'Kaiti SC', 'STKaiti', 'KaiTi', cursive;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #2a2233; color: var(--ink); font-family: var(--serif); }
body { overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; }
[hidden] { display: none !important; }

#app { position: fixed; inset: 0; overflow: hidden; user-select: none; -webkit-user-select: none; }

/* background: two layers cross-fade */
#bg, #bg .bg-layer { position: absolute; inset: 0; }
#bg .bg-layer { opacity: 0; transition: opacity .8s ease; }
#bg .bg-layer.on { opacity: 1; }
#bg svg { width: 100%; height: 100%; display: block; }

/* falling rain over everything outdoors-ish */
#rain { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.5s; }
#rain.on { opacity: 1; }
#rain i { position: absolute; top: -10%; width: 1px; height: 14vh; background: linear-gradient(transparent, rgba(220, 230, 245, 0.55)); animation: fall linear infinite; }
@keyframes fall { to { transform: translate(-3vw, 125vh); } }

/* cast */
#cast { position: absolute; inset: 0; pointer-events: none; }
.actor { position: absolute; bottom: 0; height: min(78vh, 680px); aspect-ratio: 400 / 560; transform: translateX(-50%); transition: left .6s ease, filter .4s ease, opacity .5s ease, transform .4s ease; filter: brightness(.82) saturate(.9); opacity: 0; }
.actor.in { opacity: 1; }
.actor.speaking { filter: none; transform: translateX(-50%) translateY(-6px); z-index: 2; }
.actor .breathe { width: 100%; height: 100%; animation: breathe 4.8s ease-in-out infinite; transform-origin: 50% 100%; }
.actor svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 8px 16px rgba(30, 20, 10, .25)); }
.actor.clickable { pointer-events: auto; cursor: pointer; }
#cast.hub .actor { height: min(60vh, 520px); }
#cast .actor.is-cat { height: min(40vh, 340px); }
.actor.clickable:hover { filter: brightness(1.04); }
.actor .tag { position: absolute; left: 50%; bottom: 46%; transform: translateX(-50%); padding: 4px 12px; border-radius: 999px; background: var(--paper); font-size: 14px; box-shadow: var(--shadow); white-space: nowrap; opacity: 0; transition: opacity .3s; }
.actor.clickable .tag { opacity: 1; }
@keyframes breathe { 50% { transform: scaleY(1.008) translateY(-2px); } }

/* top bar */
#topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: max(10px, env(safe-area-inset-top)) 16px 10px; z-index: 20; color: #fff8ee; text-shadow: 0 1px 6px rgba(0, 0, 0, .5); pointer-events: none; }
#topbar nav { display: flex; gap: 6px; pointer-events: auto; }
#topbar button { background: rgba(30, 22, 18, .38); color: #fff8ee; border: 1px solid rgba(255, 248, 238, .25); border-radius: 999px; padding: 6px 14px; font-size: 14px; backdrop-filter: blur(6px); }
#topbar button:hover { background: rgba(30, 22, 18, .55); }
#clock { font-size: 15px; letter-spacing: .08em; }

/* dialogue box */
#dialog { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(980px, calc(100% - 32px)); min-height: 150px; padding: 30px 34px 26px; background: var(--paper); border: 1px solid var(--edge); border-radius: 18px; box-shadow: var(--shadow); z-index: 10; cursor: pointer; }
#dialog.narration { background: rgba(32, 24, 22, .78); color: #f6ecdc; border-color: rgba(255, 240, 220, .14); }
#nameplate { position: absolute; top: -18px; left: 26px; padding: 6px 18px; border-radius: 10px; color: #fff; font-weight: 600; letter-spacing: .12em; font-size: 16px; box-shadow: 0 4px 14px rgba(0, 0, 0, .18); }
#nameplate:empty { display: none; }
#line { margin: 0; font-size: clamp(17px, 2.1vw, 21px); line-height: 1.85; letter-spacing: .03em; white-space: pre-wrap; }
#more { position: absolute; right: 24px; bottom: 14px; font-size: 13px; color: var(--accent); opacity: 0; animation: bob 1.2s ease-in-out infinite; }
#dialog.ready #more { opacity: 1; }
#dialog.narration #more { color: #f2c38f; }
@keyframes bob { 50% { transform: translateY(3px); } }

/* choices */
#choices { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; padding: 16px; z-index: 15; background: rgba(20, 14, 12, .28); }
#choices button { width: min(560px, 100%); padding: 16px 22px; border-radius: 14px; border: 1px solid var(--edge); background: var(--paper); color: var(--ink); font-size: 18px; text-align: left; box-shadow: var(--shadow); transition: transform .15s, background .15s; opacity: 0; animation: rise .4s ease forwards; }
#choices button:hover, #choices button:focus-visible { transform: translateX(6px); background: #fff; outline: 2px solid var(--accent); }
#choices button small { color: var(--accent); margin-right: 10px; font-weight: 600; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* name / text input */
#ask { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); padding: 26px; background: var(--paper-solid); border-radius: 18px; box-shadow: var(--shadow); z-index: 16; }
#ask label { display: block; line-height: 1.8; margin-bottom: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
#ask input, #chatbox input, .settings input:not([type]), .settings input[type=password], .settings select { flex: 1; min-width: 0; padding: 10px 14px; font: inherit; border: 1px solid var(--edge); border-radius: 10px; background: #fff; color: var(--ink); }
#ask button, #chatbox button, .settings button, .actions button, dialog header button { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--edge); background: #fff; color: var(--ink); }
button.primary, #ask button { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
button.danger { color: #a33b2b; }
button.ghost { background: transparent; color: #fff8ee; border-color: rgba(255, 248, 238, .5); }

/* sticky note */
#note { position: absolute; inset: 0; display: grid; place-items: center; z-index: 14; background: rgba(20, 14, 12, .3); cursor: pointer; padding: 16px; }
#note .paper { position: relative; width: min(420px, 100%); min-height: 260px; padding: 44px 34px 40px; background: linear-gradient(#ffe99b, #ffe07a); box-shadow: 0 18px 40px rgba(40, 25, 0, .35); transform: rotate(-2.2deg); animation: stick .5s cubic-bezier(.2, 1.4, .4, 1); }
#note .paper::before { content: ''; position: absolute; top: -12px; left: 50%; width: 110px; height: 26px; transform: translateX(-50%) rotate(2deg); background: rgba(255, 255, 255, .55); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
#note-text { margin: 0; font-family: var(--hand); font-size: clamp(22px, 3.6vw, 28px); line-height: 1.7; color: #3b3022; white-space: pre-wrap; }
#note-from { position: absolute; right: 26px; bottom: 14px; font-family: var(--hand); font-size: 20px; color: #6b5636; }
@keyframes stick { from { transform: rotate(-12deg) scale(.7); opacity: 0; } }

/* chapter / scene card */
#card { position: absolute; inset: 0; display: grid; place-items: center; z-index: 18; background: rgba(18, 13, 16, .62); color: #fff3e2; text-align: center; animation: fadein .8s ease; cursor: pointer; }
#card small { letter-spacing: .4em; opacity: .75; font-size: 14px; }
#card h2 { margin: 14px 0 0; font-family: var(--hand); font-weight: 400; font-size: clamp(34px, 6vw, 56px); letter-spacing: .12em; }
@keyframes fadein { from { opacity: 0; } }

/* hub */
#hub { position: absolute; left: 16px; top: 64px; z-index: 12; width: min(360px, calc(100% - 32px)); }
#hub .panel { background: var(--paper); border: 1px solid var(--edge); border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow); }
#hub h2 { margin: 0 0 6px; font-size: 20px; }
#hub p { margin: 6px 0; line-height: 1.7; color: var(--ink-soft); font-size: 15px; }
#hub .actions { margin-top: 12px; }

/* chat */
#chatbox { position: absolute; left: 50%; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 168px); transform: translateX(-50%); width: min(980px, calc(100% - 32px)); display: flex; gap: 8px; z-index: 11; }

/* title */
#title { position: absolute; inset: 0; display: grid; place-items: center; z-index: 30; background: radial-gradient(ellipse at 50% 40%, rgba(30, 20, 30, .15), rgba(20, 14, 20, .7)); color: #fff6e8; text-align: center; padding: 24px; }
#title h1 { margin: 0; font-family: var(--hand); font-weight: 400; font-size: clamp(72px, 16vw, 140px); letter-spacing: .2em; text-shadow: 0 6px 30px rgba(255, 190, 120, .35); }
#title .sub { margin: 10px 0 34px; font-size: clamp(15px, 2.4vw, 19px); opacity: .9; line-height: 1.8; }
#title .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
#title .actions button { padding: 12px 28px; font-size: 18px; border-radius: 999px; }
#title .foot { margin-top: 30px; font-size: 14px; opacity: .65; }

/* toast */
#toast { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: rgba(30, 22, 18, .78); color: #fff8ee; font-size: 14px; z-index: 40; opacity: 0; transition: opacity .4s; pointer-events: none; max-width: calc(100% - 32px); }
#toast.on { opacity: 1; }

/* modals */
dialog { width: min(620px, calc(100% - 32px)); max-height: 86vh; padding: 0; border: none; border-radius: 18px; background: var(--paper-solid); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(20, 14, 18, .55); }
dialog header { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--paper-solid); border-bottom: 1px solid var(--edge); }
dialog h3 { margin: 0; }
#log-list { margin: 0; padding: 12px 24px 24px 44px; line-height: 1.8; }
#log-list li { margin: 6px 0; }
#log-list b { margin-right: 8px; }
.settings { padding: 8px 20px 22px; }
.settings fieldset { border: 1px solid var(--edge); border-radius: 12px; margin: 14px 0; padding: 12px 16px 16px; display: grid; gap: 10px; }
.settings legend { padding: 0 6px; font-weight: 600; }
.settings label { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hint { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.7; }

@media (max-width: 720px) {
  .actor { height: min(50vh, 440px); }
  #cast.hub .actor { height: min(40vh, 340px); }
  #cast .actor.is-cat { height: min(28vh, 240px); }
  #dialog { padding: 26px 20px 22px; min-height: 140px; }
  #chatbox { bottom: calc(max(18px, env(safe-area-inset-bottom)) + 156px); }
  #hub { top: 56px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
<div id="app">
  <div id="bg"><div class="bg-layer"></div><div class="bg-layer"></div></div>
  <div id="rain" aria-hidden="true"></div>
  <div id="cast" aria-hidden="true"></div>

  <header id="topbar" hidden>
    <div id="clock"></div>
    <nav>
      <button data-act="hub" title="四楼此刻">四楼</button>
      <button data-act="log" title="回看">回看</button>
      <button data-act="settings" title="设置">设置</button>
    </nav>
  </header>

  <section id="dialog" hidden>
    <div id="nameplate"></div>
    <p id="line"></p>
    <span id="more" aria-hidden="true">▼</span>
  </section>

  <section id="choices" hidden></section>

  <form id="ask" hidden>
    <label id="ask-label" for="ask-input"></label>
    <div class="row"><input id="ask-input" maxlength="12" autocomplete="off"><button type="submit">好</button></div>
  </form>

  <section id="note" hidden><div class="paper"><p id="note-text"></p><span id="note-from"></span></div></section>

  <section id="card" hidden><div><small id="card-sub"></small><h2 id="card-title"></h2></div></section>

  <section id="hub" hidden>
    <div class="panel">
      <h2 id="hub-title"></h2>
      <p id="hub-desc"></p>
      <p id="hub-hint"></p>
      <div class="actions">
        <button id="hub-story" class="primary"></button>
      </div>
    </div>
  </section>

  <form id="chatbox" hidden>
    <input id="chat-input" placeholder="说点什么……" autocomplete="off" maxlength="200">
    <button type="submit">说</button>
    <button type="button" id="chat-end">走开</button>
  </form>

  <section id="title">
    <div class="title-inner">
      <h1>四楼</h1>
      <p class="sub">一栋没有电梯的老公寓。你搬进来的第一天，下着雨。</p>
      <div class="actions">
        <button id="btn-start" class="primary">搬进去</button>
        <button id="btn-import" class="ghost">导入存档</button>
      </div>
      <p class="foot">每天来一会儿就好。他们会等你。</p>
    </div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
</div>

<dialog id="log-modal">
  <header><h3>回看</h3><button data-close>关闭</button></header>
  <ol id="log-list"></ol>
</dialog>

<dialog id="settings-modal">
  <header><h3>设置</h3><button data-close>关闭</button></header>
  <div class="settings">
    <fieldset>
      <legend>节奏</legend>
      <label><input type="radio" name="pace" value="real"> 真实时间（每天解锁一天）</label>
      <label><input type="radio" name="pace" value="free"> 不用等（一口气看下去）</label>
    </fieldset>
    <fieldset>
      <legend>文字与声音</legend>
      <label>文字速度 <input type="range" id="set-speed" min="0" max="80" step="4"></label>
      <label><input type="checkbox" id="set-sound"> 环境音（雨声、房间声）</label>
    </fieldset>
    <fieldset>
      <legend>让角色自由聊天（可选）</legend>
      <p class="hint">接入一家大模型以后，在「四楼」里点角色可以和他们自由对话；剧情主线不变。API key 只保存在这台设备的浏览器里，导出存档时不会带上。有些厂商不允许网页直接调用，届时需要一个小代理。</p>
      <label>厂商 <select id="set-provider"></select></label>
      <label>模型 <input id="set-model" autocomplete="off"></label>
      <label>API key <input id="set-key" type="password" autocomplete="off"></label>
      <label>接口地址 <input id="set-endpoint" autocomplete="off" placeholder="留空用默认"></label>
      <label><input type="checkbox" id="set-llm-on"> 启用</label>
      <button type="button" id="set-test">测试一下</button>
      <p id="set-test-out" class="hint"></p>
    </fieldset>
    <fieldset>
      <legend>存档</legend>
      <div class="row">
        <button type="button" id="set-export">导出存档</button>
        <button type="button" id="set-import">导入存档</button>
        <button type="button" id="set-reset" class="danger">重新开始</button>
      </div>
    </fieldset>
  </div>
</dialog>

<input type="file" id="file-import" accept="application/json,.json" hidden>

// Scene runner. A scene is a list of steps; the runner is a generator that yields only
// the events the UI must show, and applies state changes (flags, affinity, memory) inline.

// Step forms:
//   { text }                       narration
//   { say, face?, text }           a character line

//   { input: key, prompt, fallback } ask the player for a short text ('name' sets state.name)

const AFF_MIN = -5;
const AFF_MAX = 20;

function evalCond(cond, state) {
  if (!cond) return true;
  if (typeof cond === 'function') return !!cond(state);
  if (cond.all) return cond.all.every(c => evalCond(c, state));
  if (cond.any) return cond.any.some(c => evalCond(c, state));
  if (cond.not) return !evalCond(cond.not, state);
  if ('flag' in cond) return !!state.flags[cond.flag];
  if ('mem' in cond) return state.mem[cond.mem] !== undefined;
  if ('memIs' in cond) return state.mem[cond.memIs[0]] === cond.memIs[1];
  if ('seen' in cond) return !!state.done[cond.seen];
  if ('aff' in cond) {
    const [who, op, n] = cond.aff;
    const v = state.aff[who] ?? 0;
    switch (op) {
      case '>=': return v >= n;
      case '>': return v > n;
      case '<=': return v <= n;
      case '<': return v < n;
      case '==': return v === n;
      default: throw new Error(`unknown aff op ${op}`);
    }
  }
  throw new Error(`unknown condition ${JSON.stringify(cond)}`);
}

function applyEffects(step, state) {
  if (step.set) for (const k of [].concat(step.set)) state.flags[k] = true;
  if (step.unset) for (const k of [].concat(step.unset)) delete state.flags[k];
  if (step.aff) {
    for (const [who, d] of Object.entries(step.aff)) {

  const raw = typeof text === 'function' ? text(state) : text;

    .replace(/\{name\}/g, state.name || '你')
    .replace(/\{m:([a-zA-Z0-9_]+)\}/g, (_, k) => (state.mem[k] ?? ''));
}

function* runSteps(steps, state) {

      if (step.then || step.else) {
        yield* runSteps(evalCond(step.if, state) ? (step.then || []) : (step.else || []), state);

      if (!evalCond(step.if, state)) continue;

    if (step.bg) yield { type: 'bg', bg: step.bg, time: step.time, weather: step.weather };
    if (step.show) yield { type: 'show', show: step.show };
    if (step.pause) yield { type: 'pause', ms: step.pause };

      yield { type: 'note', from: step.from || step.note, text: renderText(step.text, state) };
    } else if ('say' in step) {
      yield { type: 'say', who: step.say, face: step.face || 'normal', text: renderText(step.text, state) };
    } else if ('text' in step) {

// Real-time rhythm: one story day per real calendar day. Leaving is never punished.

function dateKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function daysBetween(a, b) {
  if (!a || !b) return 0;
  const [ya, ma, da] = a.split('-').map(Number);
  const [yb, mb, db] = b.split('-').map(Number);
  return Math.round((Date.UTC(yb, mb - 1, db) - Date.UTC(ya, ma - 1, da)) / 86400000);
}

function scenesOfDay(chapter, day) {
  return chapter.scenes.filter(s => s.day === day);

function dayComplete(chapter, state, day) {
  const list = scenesOfDay(chapter, day);
  return list.length > 0 && list.every(s => state.done[s.id]);
}

// What can be played right now.
//   { status: 'play', day, scene }      next scene to play
//   { status: 'wait', day }             day `day` is unlocked tomorrow
//   { status: 'end' }                   chapter finished
function nextUp(chapter, state, today) {
  for (let day = 0; day <= chapter.lastDay; day++) {
    const list = scenesOfDay(chapter, day);
    const pending = list.find(s => !state.done[s.id]);
    if (!pending) continue;
    if (day > 0 && state.settings.pace === 'real') {
      const prevDone = state.dayDoneOn[day - 1];
      if (prevDone && daysBetween(prevDone, today) < 1) return { status: 'wait', day };
    }
    return { status: 'play', day, scene: pending };
  }

}

  if (dayComplete(chapter, state, day) && !state.dayDoneOn[day]) {
    state.dayDoneOn[day] = today;
    return true;
  }
  return false;
}

function absence(state, today) {
  return state.lastVisit ? Math.max(0, daysBetween(state.lastVisit, today)) : 0;
}

function partOfDay(d = new Date()) {
  const h = d.getHours();
  if (h >= 5 && h < 9) return 'dawn';
  if (h >= 9 && h < 17) return 'day';
  if (h >= 17 && h < 20) return 'dusk';
  return 'night';
}

// Game state, local save, and save-file export/import.

const SAVE_KEY = 'fourth-floor.save.v1';
const SETTINGS_KEY = 'fourth-floor.settings.v1';
const VERSION = 1;

function defaultSettings() {
  return {
    pace: 'real',          // 'real' = one day per real day; 'free' = no waiting
    textSpeed: 32,         // ms per character; 0 = instant
    sound: false,
    llm: { enabled: false, provider: 'none', model: '', key: '', endpoint: '' }
  };
}

function newState(name = '') {
  return {
    v: VERSION,
    name,
    startedOn: null,
    lastVisit: null,
    done: {},
    dayDoneOn: {},
    flags: {},
    aff: { ache: 0, xiaoman: 0, laozhou: 0, nico: 0, cat: 0 },
    mem: {},
    chats: {},             // per-character small talk count, for idle line rotation
    settings: defaultSettings()
  };
}

function safeStorage(storage) {
  return {
    get(k) { try { return storage?.getItem(k) ?? null; } catch { return null; } },
    set(k, v) { try { storage?.setItem(k, v); return true; } catch { return false; } },
    del(k) { try { storage?.removeItem(k); } catch { /* ignore */ } }
  };
}

// The API key lives apart from the save so that exported save files never carry it.
function load(storage) {
  const s = safeStorage(storage);
  let state = null;
  const raw = s.get(SAVE_KEY);
  if (raw) {
    try { state = migrate(JSON.parse(raw)); } catch { state = null; }
  }
  state = state || newState();
  const rawSettings = s.get(SETTINGS_KEY);
  if (rawSettings) {
    try {
      const saved = JSON.parse(rawSettings);
      state.settings = { ...defaultSettings(), ...saved, llm: { ...defaultSettings().llm, ...(saved.llm || {}) } };
    } catch { /* keep defaults */ }
  }
  return state;
}

function save(storage, state) {
  const s = safeStorage(storage);
  const { settings, ...rest } = state;
  const ok1 = s.set(SAVE_KEY, JSON.stringify(rest));
  const ok2 = s.set(SETTINGS_KEY, JSON.stringify(settings));
  return ok1 && ok2;
}

function reset(storage) {
  safeStorage(storage).del(SAVE_KEY);
}

function migrate(obj) {
  if (!obj || typeof obj !== 'object') throw new Error('not a save');
  if (obj.v !== VERSION) throw new Error(`unsupported save version ${obj.v}`);
  const base = newState();
  return {
    ...base,
    ...obj,
    aff: { ...base.aff, ...(obj.aff || {}) },
    settings: base.settings
  };
}

function exportSave(state) {
  const { settings, ...rest } = state;
  return JSON.stringify({ kind: 'fourth-floor-save', exportedAt: new Date().toISOString(), state: rest }, null, 2);
}

function importSave(text, currentSettings) {
  const obj = JSON.parse(text);
  if (obj.kind !== 'fourth-floor-save') throw new Error('这不是四楼的存档文件');
  const state = migrate(obj.state);
  state.settings = currentSettings || defaultSettings();
  return state;
}

return { SAVE_KEY, SETTINGS_KEY, defaultSettings, newState, load, save, reset, migrate, exportSave, importSave };
});

// Painted backgrounds, drawn as SVG. One drawing per room; time of day and rain are overlays.
// Canvas is 1600x900; the stage scales it with preserveAspectRatio="xMidYMid slice".

const W = 1600, H = 900;

const TIMES = {
  dawn:  { sky: ['#f3c9a8', '#c9d3e6'], tint: '#ffb98a', tintA: 0.10, lamps: false, sun: '#fff1d6' },
  day:   { sky: ['#bfdcef', '#eef3ea'], tint: '#ffffff', tintA: 0.00, lamps: false, sun: '#fffbe9' },
  dusk:  { sky: ['#f19a62', '#6f6496'], tint: '#ff9a5c', tintA: 0.16, lamps: true,  sun: '#ffd29a' },
  night: { sky: ['#141a33', '#2f3560'], tint: '#141a40', tintA: 0.34, lamps: true,  sun: '#cfd8ff' }
};

function rng(seed) {
  let s = seed >>> 0;
  return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
}

function defs(time, weather) {
  const T = TIMES[time] || TIMES.day;
  const rain = weather === 'rain';
  const sky = rain ? (time === 'night' ? ['#151a28', '#2b3142'] : ['#8d97a6', '#c3c8cf']) : T.sky;
  return `
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2a8" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#ffc977" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1b1208" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="floorWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98a5e"/><stop offset="1" stop-color="#8a5f3c"/>
    </linearGradient>
    <linearGradient id="wallWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e3c8"/><stop offset="1" stop-color="#e2cfaa"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0.09 0"/>
    </filter>
  </defs>`;
}

// A window that shows the outside: sky, a low city line, maybe the bridge, rain streaks.
function windowView(x, y, w, h, time, weather, opts = {}) {
  const T = TIMES[time] || TIMES.day;
  const r = rng(x * 7 + y);
  const id = `win${x}${y}`;
  let city = '';
  const base = y + h * (opts.horizon ?? 0.72);
  let cx = x - 10;
  while (cx < x + w + 10) {
    const bw = 30 + r() * 60, bh = 30 + r() * h * 0.35;
    city += `<rect x="${cx.toFixed(1)}" y="${(base - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${(bh + h).toFixed(1)}" fill="${time === 'night' ? '#1d2140' : '#8f8aa3'}" opacity="${time === 'night' ? 0.95 : 0.55}"/>`;
    if (T.lamps) {
      for (let k = 0; k < 4; k++) {
        if (r() < 0.55) city += `<rect x="${(cx + 6 + r() * (bw - 14)).toFixed(1)}" y="${(base - bh + 8 + r() * (bh - 12)).toFixed(1)}" width="5" height="7" fill="#ffd98a" opacity="${0.6 + r() * 0.4}"/>`;
      }
    }
    cx += bw + 4;
  }
  const stars = time === 'night' && weather !== 'rain'
    ? Array.from({ length: 14 }, () => `<circle cx="${(x + r() * w).toFixed(1)}" cy="${(y + r() * h * 0.5).toFixed(1)}" r="${(0.8 + r() * 1.4).toFixed(1)}" fill="#fff" opacity="${0.4 + r() * 0.6}"/>`).join('')
    : '';
  const sun = !opts.noSun && weather !== 'rain' && time !== 'day'
    ? `<circle cx="${x + w * 0.72}" cy="${y + h * (time === 'night' ? 0.22 : 0.5)}" r="${time === 'night' ? 16 : 28}" fill="${T.sun}" opacity="0.9"/>`
    : '';
  const streaks = weather === 'rain'
    ? Array.from({ length: Math.round(w / 9) }, () => {
        const sx = x + r() * w, sy = y + r() * h, len = 18 + r() * 30;
        return `<line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${(sx - 4).toFixed(1)}" y2="${(sy + len).toFixed(1)}" stroke="#dfe7f2" stroke-width="1.2" opacity="0.45"/>`;

    ${opts.bridge ? bridge(x, base - 10, w, time) : ''}

function bridge(x, y, w, time) {

  let s = `<path d="M${x - 20} ${y} Q ${x + w * 0.5} ${y - 70} ${x + w + 20} ${y}" stroke="${time === 'night' ? '#39406b' : '#6e6a85'}" stroke-width="6" fill="none"/>`;
  s += `<rect x="${x - 20}" y="${y}" width="${w + 40}" height="8" fill="${time === 'night' ? '#2d3358' : '#77738d'}"/>`;
  for (let i = 0; i <= 10; i++) {
    const px = x + (w * i) / 10;
    s += `<line x1="${px}" y1="${y}" x2="${px}" y2="${y - 70 * (1 - Math.pow((i - 5) / 5, 2))}" stroke="${time === 'night' ? '#39406b' : '#6e6a85'}" stroke-width="2"/>`;
    if (lights) s += `<circle cx="${px}" cy="${y - 2}" r="3" fill="#ffd27a"/>`;

  return s;
}

// Glows are collected while a room draws and painted above the time-of-day tint,
// so lamps stay warm at night instead of being darkened with the room.
let GLOWS = [];
function lampGlow(cx, cy, r, on) {

  return '';
}

function floorBoards(y0) {
  let s = `<rect x="0" y="${y0}" width="${W}" height="${H - y0}" fill="url(#floorWood)"/>`;
  for (let i = 1; i < 7; i++) {
    const y = y0 + (H - y0) * Math.pow(i / 7, 1.4);
    s += `<line x1="0" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="#6f4a2c" stroke-width="1.5" opacity="0.35"/>`;
  }
  return s;
}

function pothos(x, y) {
  let s = `<path d="M${x - 34} ${y} h68 l-8 46 h-52 z" fill="#c8775a"/>`;
  const r = rng(x + y);
  for (let v = 0; v < 4; v++) {
    let px = x - 20 + v * 13, py = y + 4;
    let d = `M${px} ${py}`;
    for (let k = 0; k < 7; k++) {
      const nx = px + (r() - 0.5) * 40 + (v - 1.5) * 8, ny = py + 22 + r() * 14;
      d += ` Q ${px + (r() - 0.5) * 30} ${py + 10} ${nx.toFixed(1)} ${ny.toFixed(1)}`;
      s += `<ellipse cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" rx="11" ry="7" fill="${r() < 0.5 ? '#5f9a52' : '#78b062'}" transform="rotate(${(r() * 80 - 40).toFixed(0)} ${nx.toFixed(1)} ${ny.toFixed(1)})"/>`;

    }
    s = `<path d="${d}" stroke="#4d7d43" stroke-width="2.5" fill="none"/>` + s;
  }
  for (let k = 0; k < 8; k++) s += `<ellipse cx="${x - 26 + k * 7}" cy="${y - 6 - (k % 3) * 6}" rx="12" ry="8" fill="#6aa65a"/>`;

function stickyNotes(x, y, cols, rows, seed) {

function rooftop(time, weather) {
  const r = rng(91);

  <rect width="${W}" height="${H}" fill="url(#sky)"/>

  ${time === 'dusk' && weather !== 'rain' ? `<circle cx="1180" cy="520" r="90" fill="#ffcf8a" opacity="0.65" filter="url(#glow)"/>` : ''}

  ${Array.from({ length: 30 }, () => `<rect x="${(r() * W).toFixed(0)}" y="${(680 + r() * 200).toFixed(0)}" width="${(20 + r() * 50).toFixed(0)}" height="3" fill="#8e8476" opacity="0.6"/>`).join('')}
  <!-- clothesline -->

// Shorthands for writing scripts.
const say = who => (face, text, extra = {}) =>
  (text === undefined ? { say: who, face: 'normal', text: face, ...extra } : { say: who, face, text, ...extra });

const che = say('ache');
const man = say('xiaoman');
const zhou = say('laozhou');
const nico = say('nico');
const cat = text => ({ say: 'cat', face: 'normal', text: text || '喵。' });
const me = text => ({ say: 'me', face: 'normal', text });
const t = text => ({ text });
const note = (from, text) => ({ note: from, text });
const bg = (bg, time, weather) => ({ bg, time, weather });
const show = (...ids) => ({ show: ids });
const choice = (...options) => ({ choice: options });
const opt = (text, then = [], effects = {}) => ({ text, then, ...effects });
const when = (cond, then, otherwise) => ({ if: cond, then, else: otherwise });

return { che, man, zhou, nico, cat, me, t, note, bg, show, choice, opt, when };

// Provider table and request/response shapes. Endpoints and example model names follow each
// vendor's public docs as known at the time of writing; the settings panel lets the player
// override both, so a renamed model or moved endpoint never needs a code change.
//
// Formats:
//   anthropic  POST /v1/messages              { system, messages, max_tokens }
//   openai     POST .../chat/completions       { messages:[{role:'system'},...] }   (also DeepSeek, Qwen, Kimi, GLM, custom)
//   gemini     POST .../models/{m}:generateContent { systemInstruction, contents }
//   ollama     POST /api/chat                  { messages, stream:false }

const PROVIDERS = {
  none:      { label: '不接入（使用内置台词）', format: null },
  anthropic: { label: 'Anthropic Claude', format: 'anthropic', endpoint: 'https://api.anthropic.com/v1/messages', model: 'claude-sonnet-5-5', needsKey: true },
  openai:    { label: 'OpenAI', format: 'openai', endpoint: 'https://api.openai.com/v1/chat/completions', model: '', modelHint: '填写模型名', needsKey: true },
  gemini:    { label: 'Google Gemini', format: 'gemini', endpoint: 'https://generativelanguage.googleapis.com/v1beta/models', model: '', modelHint: '填写模型名', needsKey: true },
  deepseek:  { label: 'DeepSeek', format: 'openai', endpoint: 'https://api.deepseek.com/chat/completions', model: 'deepseek-chat', needsKey: true },
  qwen:      { label: '通义千问（阿里云百炼）', format: 'openai', endpoint: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', model: 'qwen-plus', needsKey: true },
  kimi:      { label: 'Kimi（月之暗面）', format: 'openai', endpoint: 'https://api.moonshot.cn/v1/chat/completions', model: '', modelHint: '填写模型名', needsKey: true },
  glm:       { label: '智谱 GLM', format: 'openai', endpoint: 'https://open.bigmodel.cn/api/paas/v4/chat/completions', model: '', modelHint: '填写模型名', needsKey: true },
  ollama:    { label: 'Ollama（本机）', format: 'ollama', endpoint: 'http://localhost:11434/api/chat', model: '', modelHint: '本机已拉取的模型名', needsKey: false },
  custom:    { label: '自定义（OpenAI 兼容）', format: 'openai', endpoint: '', model: '', modelHint: '填写模型名', needsKey: false }
};

function resolveConfig(cfg) {
  const p = PROVIDERS[cfg.provider];
  if (!p || !p.format) return null;
  return {
    format: p.format,
    endpoint: (cfg.endpoint || p.endpoint || '').trim(),
    model: (cfg.model || p.model || '').trim(),
    key: (cfg.key || '').trim(),
    needsKey: p.needsKey
  };
}

function buildRequest(cfg, system, messages, maxTokens = 300) {
  const c = resolveConfig(cfg);
  if (!c) throw new Error('未选择厂商');
  if (!c.endpoint) throw new Error('缺少接口地址');
  if (!c.model) throw new Error('缺少模型名');
  if (c.needsKey && !c.key) throw new Error('缺少 API key');
  const json = body => JSON.stringify(body);
  switch (c.format) {
    case 'anthropic':
      return {
        url: c.endpoint,
        init: {
          method: 'POST',
          headers: {
            'content-type': 'application/json',
            'x-api-key': c.key,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: json({ model: c.model, max_tokens: maxTokens, system, messages })
        }
      };
    case 'openai': {
      const headers = { 'content-type': 'application/json' };
      if (c.key) headers.authorization = `Bearer ${c.key}`;
      return {
        url: c.endpoint,
        init: { method: 'POST', headers, body: json({ model: c.model, max_tokens: maxTokens, messages: [{ role: 'system', content: system }, ...messages] }) }
      };
    }
    case 'gemini':
      return {
        url: `${c.endpoint.replace(/\/$/, '')}/${encodeURIComponent(c.model)}:generateContent`,
        init: {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-goog-api-key': c.key },
          body: json({
            systemInstruction: { parts: [{ text: system }] },
            contents: messages.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })),
            generationConfig: { maxOutputTokens: maxTokens }
          })
        }
      };
    case 'ollama':
      return {
        url: c.endpoint,
        init: { method: 'POST', headers: { 'content-type': 'application/json' }, body: json({ model: c.model, stream: false, messages: [{ role: 'system', content: system }, ...messages] }) }
      };
    default:
      throw new Error(`unknown format ${c.format}`);
  }
}

function parseResponse(format, data) {
  switch (format) {
    case 'anthropic': return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
    case 'openai': return (data.choices?.[0]?.message?.content || '').trim();
    case 'gemini': return (data.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
    case 'ollama': return (data.message?.content || '').trim();
    default: return '';
  }
}

return { PROVIDERS, resolveConfig, buildRequest, parseResponse };
});

// Ambient sound synthesized on the fly: rain (filtered noise) and a soft room tone.
// Nothing plays until the player turns sound on.

let ctx = null, rainGain = null, roomGain = null, master = null;

function noiseBuffer(c, seconds = 2) {
  const buf = c.createBuffer(1, c.sampleRate * seconds, c.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < d.length; i++) {
    const white = Math.random() * 2 - 1;
    last = (last + 0.02 * white) / 1.02;      // brown-ish
    d[i] = last * 3.5;
  }
  return buf;
}

function ensure() {
  if (ctx) return ctx;
  const AC = globalThis.AudioContext || globalThis.webkitAudioContext;
  if (!AC) return null;
  ctx = new AC();
  master = ctx.createGain(); master.gain.value = 0.0; master.connect(ctx.destination);

  const rain = ctx.createBufferSource(); rain.buffer = noiseBuffer(ctx, 3); rain.loop = true;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6000;
  rainGain = ctx.createGain(); rainGain.gain.value = 0;
  rain.connect(hp).connect(lp).connect(rainGain).connect(master); rain.start();

  const room = ctx.createBufferSource(); room.buffer = noiseBuffer(ctx, 4); room.loop = true;
  const lp2 = ctx.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 260;
  roomGain = ctx.createGain(); roomGain.gain.value = 0.25;
  room.connect(lp2).connect(roomGain).connect(master); room.start();
  return ctx;
}

function setSound(on) {
  const c = ensure();
  if (!c) return;
  if (c.state === 'suspended') c.resume();
  master.gain.setTargetAtTime(on ? 0.55 : 0, c.currentTime, 0.6);
}

function setRain(on) {
  if (!ctx) return;
  rainGain.gain.setTargetAtTime(on ? 0.5 : 0, ctx.currentTime, 1.2);
}

// A tiny two-note chime for page turns and notes.
function chime() {
  if (!ctx || master.gain.value < 0.01) return;
  const t = ctx.currentTime;
  for (const [f, dt] of [[880, 0], [1320, 0.09]]) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t + dt); g.gain.linearRampToValueAtTime(0.08, t + dt + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.8);
    o.connect(g).connect(master); o.start(t + dt); o.stop(t + dt + 0.9);
  }
}

return { setSound, setRain, chime };
});

        break;
      case 'bg':
        setBg(ev.bg, ev.time || current.time, ev.weather || current.weather);
        setClock(scene.day, ev.time || current.time, ev.weather || current.weather);
        await sleep(300);
        break;
      case 'show': setCast(ev.show); await sleep(200); break;
      case 'pause': await sleep(ev.ms); break;
      case 'text': await showLine({ text: ev.text }); break;
      case 'say': await showLine(ev); break;
      case 'note': $('#dialog').hidden = true; await showNote(ev.from, ev.text); break;
      case 'choice': reply = await showChoices(ev.options); break;
      case 'input': reply = await askInput(ev.prompt, ev.placeholder); break;
      default: break;
    }
    r = gen.next(reply);
  }
  state.lastVisit = today();
  if (!state.startedOn) state.startedOn = today();
  const finishedDay = markDayIfComplete(chapter1, state, scene.day, today());
  persist();
  $('#dialog').hidden = true;
  return finishedDay;
}

let storyRunning = false;
async function continueStory() {
  if (storyRunning) return;
  storyRunning = true;
  try { await storyLoop(); } finally { storyRunning = false; }
  enterHub();
}

async function storyLoop() {
  for (;;) {
    const up = nextUp(chapter1, state, today());
    if (up.status !== 'play') break;
    const finishedDay = await playScene(up.scene);
    if (finishedDay) {
      setCast([]);
      await showCard(dayLabel(up.day), up.day === chapter1.lastDay ? '第一章 · 完' : '今天就到这里', 3200);
      break;
    }
  }
}

// ───────────────────────── hub: the apartment right now ─────────────────────────
let welcomed = false;
function hubWeather() {
  const k = [...today()].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  return k % 5 === 0 ? 'rain' : 'clear';
}

function enterHub() {
  mode = 'hub';
  for (const id of ['#dialog', '#choices', '#note', '#ask', '#chatbox']) $(id).hidden = true;
  $('#topbar').hidden = false;
  const part = realPart();
  const p = presentNow(part, state);
  const weather = hubWeather();
  setBg(p.room, part, weather);
  setCast(p.who, { clickable: true });
  const up = nextUp(chapter1, state, today());
  const day = up.day ?? chapter1.lastDay;
  $('#clock').textContent = `${today().slice(5).replace('-', '月')}日 · ${TIME_LABEL[part]}${weather === 'rain' ? ' · 雨' : ''}`;
  $('#hub-title').textContent = `四楼此刻 · ${ROOM_LABEL[p.room]}`;
  $('#hub-desc').textContent = WORLD.place[p.room].replace(/^[^：]+：/, '');
  const btn = $('#hub-story');
  if (up.status === 'play') {
    btn.hidden = false;
    btn.textContent = up.scene.id === 'd0-arrive' ? '开始：搬进来的那天' : `继续：${dayLabel(up.day)}`;
    $('#hub-hint').textContent = '点一下他们，可以聊几句。';
  } else if (up.status === 'wait') {
    btn.hidden = true;
    const h = 24 - new Date().getHours();
    $('#hub-hint').textContent = `${dayLabel(day)}的故事明天开始（大约 ${h} 小时后）。今晚他们都在，点一下就能聊。`;
  } else {
    btn.hidden = true;
    $('#hub-hint').textContent = '第一章到这里结束了。第二章还在写。你可以随时回来坐坐。';
  }
  $('#hub').hidden = false;
  const gap = absence(state, today());
  state.lastVisit = today();
  persist();
  if (!welcomed) {
    welcomed = true;
    const wb = welcomeBack(gap, state);
    if (wb) hubSay(wb.who, wb.face, renderText(wb.text, state));
  }
}

async function hubSay(who, face, text) {
  if (!onStage.includes(who)) setCast([...onStage, who].slice(-5), { clickable: true });
  await showLine({ who, face, text });
  $('#dialog').hidden = true;
  for (const el of $('#cast').children) el.classList.remove('speaking');
}

function idleLine(id) {
  const pool = (IDLE[id] || []).filter(l => evalCond(l.if, state));
  if (!pool.length) return { face: 'normal', text: '……' };
  const n = state.chats[id] || 0;
  state.chats[id] = n + 1;
  persist();
  const l = pool[n % pool.length];
  return { face: l.face || 'normal', text: renderText(l.text, state) };
}

let chatting = null;   // { id, history, busy }
$('#cast').addEventListener('click', async e => {
  const el = e.target.closest('.actor.clickable');
  if (!el || mode !== 'hub' || waiter) return;
  const id = el.dataset.id;
  const line = idleLine(id);
  if (id !== 'cat' && llm.isEnabled(state.settings)) {
    startChat(id, line);
  } else {
    await hubSay(id, line.face, line.text);
  }
});

async function startChat(id, opening) {
  mode = 'chat';
  $('#hub').hidden = true;
  chatting = { id, history: [{ role: 'assistant', content: opening.text }], busy: false };
  setFace(id, opening.face);
  showChatLine(id, opening.face, opening.text);
  $('#chatbox').hidden = false;
  $('#chat-input').value = '';
  $('#chat-input').focus();
}

function showChatLine(who, face, text) {
  const box = $('#dialog');
  box.hidden = false;
  box.classList.remove('narration');
  box.classList.add('ready');
  $('#nameplate').textContent = speakerName(who);
  $('#nameplate').style.background = CHARACTERS[who]?.color || '#8a7a6a';
  $('#line').textContent = text;
  if (who !== 'me') setFace(who, face);
  log.push({ who: speakerName(who), text });
}

$('#chatbox').addEventListener('submit', async e => {
  e.preventDefault();
  if (!chatting || chatting.busy) return;
  const text = $('#chat-input').value.trim();
  if (!text) return;
  $('#chat-input').value = '';
  chatting.history.push({ role: 'user', content: text });
  log.push({ who: speakerName('me'), text });
  chatting.busy = true;
  showChatLine(chatting.id, 'normal', '……');
  try {
    const titles = chapter1.scenes.filter(s => state.done[s.id]).map(s => s.title).slice(-8);
    const reply = await llm.chat({ id: chatting.id, state, history: chatting.history.slice(-12), sceneTitles: titles });
    chatting.history.push({ role: 'assistant', content: reply });
    showChatLine(chatting.id, /[哈笑！]/.test(reply) ? 'smile' : 'normal', reply);
  } catch (err) {
    toast(`没连上：${String(err.message || err).slice(0, 80)}`);
    const l = idleLine(chatting.id);
    showChatLine(chatting.id, l.face, l.text);
  } finally {
    if (chatting) chatting.busy = false;
  }
});
$('#chat-end').addEventListener('click', () => { chatting = null; enterHub(); });

$('#hub-story').addEventListener('click', () => { if (!waiter) continueStory(); });

// ───────────────────────── top bar, log, settings ─────────────────────────
$('#topbar').addEventListener('click', e => {
  const act = e.target.closest('button')?.dataset.act;
  if (act === 'hub' && mode === 'story') toast('先把这一段看完吧。');
  else if (act === 'hub') { chatting = null; enterHub(); }
  if (act === 'log') openLog();
  if (act === 'settings') openSettings();
});
for (const d of document.querySelectorAll('dialog')) {
  d.addEventListener('click', e => { if (e.target === d || e.target.matches('[data-close]')) d.close(); });
}

function openLog() {
  const ol = $('#log-list');
  ol.innerHTML = '';
  for (const { who, text } of log.slice(-120)) {
    const li = document.createElement('li');
    if (who) { const b = document.createElement('b'); b.textContent = who; li.append(b); }
    li.append(text);
    ol.append(li);
  }
  $('#log-modal').showModal();
  ol.lastElementChild?.scrollIntoView({ block: 'end' });
}

function openSettings() {
  const s = state.settings;
  for (const r of document.querySelectorAll('input[name=pace]')) r.checked = r.value === s.pace;
  $('#set-speed').value = 80 - s.textSpeed;
  $('#set-sound').checked = s.sound;
  const sel = $('#set-provider');
  if (!sel.options.length) for (const [id, p] of Object.entries(PROVIDERS)) sel.add(new Option(p.label, id));
  sel.value = s.llm.provider;
  fillProviderFields();
  $('#set-llm-on').checked = s.llm.enabled;
  $('#set-test-out').textContent = '';
  $('#settings-modal').showModal();
}

function fillProviderFields() {
  const s = state.settings.llm, p = PROVIDERS[$('#set-provider').value];
  $('#set-model').value = s.provider === $('#set-provider').value ? s.model : '';
  $('#set-model').placeholder = p.model || p.modelHint || '';
  $('#set-key').value = s.key;
  $('#set-endpoint').value = s.provider === $('#set-provider').value ? s.endpoint : '';
  $('#set-endpoint').placeholder = p.endpoint || '必填';
}

function readSettings() {
  const s = state.settings;
  s.pace = document.querySelector('input[name=pace]:checked')?.value || 'real';
  s.textSpeed = 80 - Number($('#set-speed').value);
  s.sound = $('#set-sound').checked;
  s.llm = {
    provider: $('#set-provider').value,
    model: $('#set-model').value.trim(),
    key: $('#set-key').value.trim(),
    endpoint: $('#set-endpoint').value.trim(),
    enabled: $('#set-llm-on').checked
  };
  setSound(s.sound);
  persist();
}
$('#settings-modal').addEventListener('change', e => {
  if (e.target.id === 'set-provider') fillProviderFields();
  readSettings();
});
$('#settings-modal').addEventListener('close', () => { if (mode === 'hub') enterHub(); });

$('#set-test').addEventListener('click', async () => {
  readSettings();
  const out = $('#set-test-out');
  out.textContent = '正在问阿澈……';
  try {
    const reply = await llm.chat({ id: 'ache', state: { ...state, settings: { ...state.settings, llm: { ...state.settings.llm, enabled: true } } }, history: [{ role: 'user', content: '你好，在吗？' }] });
    out.textContent = `阿澈：${reply}`;
  } catch (err) {
    out.textContent = `没连上：${String(err.message || err).slice(0, 160)}`;
  }
});

function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name;
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
$('#set-export').addEventListener('click', () => download(`四楼存档-${today()}.json`, exportSave(state)));
$('#set-import').addEventListener('click', () => $('#file-import').click());
$('#btn-import').addEventListener('click', () => $('#file-import').click());
$('#file-import').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    state = importSave(await f.text(), state.settings);
    persist();
    toast('存档已导入。');
    $('#settings-modal').close();
    $('#title').hidden = true;
    enterHub();
  } catch (err) {
    toast(`导入失败：${err.message}`);
  }
});
let resetArmed = 0;
$('#set-reset').addEventListener('click', e => {
  if (Date.now() - resetArmed > 3000) {
    resetArmed = Date.now();
    e.target.textContent = '再点一次，确认重新开始';
    setTimeout(() => { e.target.textContent = '重新开始'; }, 3000);
    return;
  }
  const settings = state.settings;
  reset(storage);
  state = newState();
  state.settings = settings;
  persist();
  location.reload();
});

// ───────────────────────── title ─────────────────────────
function boot() {
  const part = realPart();
  setBg('living', part, hubWeather());
  const started = Object.keys(state.done).length > 0;
  $('#btn-start').textContent = started ? '回到四楼' : '搬进去';
  $('#btn-start').addEventListener('click', () => {
    $('#title').hidden = true;
    if (state.settings.sound) setSound(true);
    if (!started) continueStory();
    else enterHub();
  });
  window.__FF__ = { get state() { return state; }, get mode() { return mode; }, chapter: chapter1 };
}
boot();

return {  };
